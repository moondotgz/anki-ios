name: Build unsigned IPA

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (Xcode 27)
    runs-on: xcode-27
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Select Xcode 27
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.0"

      - name: Read version
        id: version
        run: |
          VERSION=$(sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' project.yml | head -1)
          echo "version=${VERSION:-1.0.0}" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Version ${VERSION:-1.0.0} build ${{ github.run_number }}"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project AnkiSwift.xcodeproj \
            -scheme AnkiSwift \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Build app (unsigned)
        run: |
          if ! xcodebuild build \
            -project AnkiSwift.xcodeproj \
            -scheme AnkiSwift \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" > xcodebuild.log 2>&1
          then
            grep -E "error:" xcodebuild.log | sort -u | head -100
            tail -50 xcodebuild.log
            exit 1
          fi
          grep -E "warning:" xcodebuild.log | sort -u | head -50 || true
          tail -3 xcodebuild.log

      - name: Package IPA
        run: |
          APP_PATH="DerivedData/Build/Products/Release-iphoneos/AnkiSwift.app"
          test -d "$APP_PATH"
          rm -rf Payload && mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry AnkiSwift-unsigned.ipa Payload
          ls -lh AnkiSwift-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v5
        with:
          name: AnkiSwift-unsigned-ipa
          path: AnkiSwift-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: xcodebuild-log
          path: xcodebuild.log

  release:
    name: Publish release
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Download IPA
        uses: actions/download-artifact@v5
        with:
          name: AnkiSwift-unsigned-ipa

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          BUILD: ${{ needs.build.outputs.build }}
        run: |
          IPA="AnkiSwift-${VERSION}-${BUILD}.ipa"
          mv AnkiSwift-unsigned.ipa "$IPA"
          {
            echo "<!-- version: ${VERSION} -->"
            echo "<!-- build: ${BUILD} -->"
            # commit message without trailers, blank lines squeezed
            git log -1 --format=%B "$GITHUB_SHA" \
              | grep -viE "^(co-authored-by|claude-session|signed-off-by):" \
              | cat -s | head -20
          } > notes.md
          gh release create "build-${BUILD}" "$IPA" \
            --title "AnkiSwift ${VERSION} (${BUILD})" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"

  pages:
    name: Publish SideStore / AltStore source
    needs: release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build site
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          mkdir -p _site
          cp site/index.html _site/
          cp AnkiApp/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png _site/icon.png
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate --slurp > releases.json
          python3 scripts/make_source.py releases.json "${BASE_URL%/}/" _site/apps.json
          touch _site/.nojekyll

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
